spring.application.name=job-tracker
spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]

app.frontend.url=${FRONTEND_URL:http://localhost:5174}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/job_tracker}
spring.datasource.username=${DB_USERNAME:job_tracker_user}
spring.datasource.password=${DB_PASSWORD}
server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:28800000}

resend.api.key=${RESEND_API_KEY:${MAIL_PASSWORD}}
resend.from.email=${RESEND_FROM_EMAIL:onboarding@resend.dev}