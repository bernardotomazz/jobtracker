<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO Meta Tags -->

    <!-- Favicon & PWA Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/favicon.svg?v=2" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Theme Color for Browsers -->
    <meta
      name="theme-color"
      content="#0F6B61"
      media="(prefers-color-scheme: light)"
    />

      name="theme-color"
      content="#0A0D0C"

      property="og:description"
      content="Organize suas vagas, acompanhe etapas em um quadro Kanban intuitivo e conquiste sua próxima oportunidade profissional."
    />
    <meta
      property="og:image"
      content="https://waldo-2mf.pages.dev/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

      content="Interface do Waldo exibindo o quadro Kanban de acompanhamento de vagas"

      name="twitter:title"

    />

    <!-- Schema.org Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Waldo",
        "url": "https://waldo-2mf.pages.dev",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "All",
        "description": "Plataforma para acompanhamento e organização de candidaturas e processos seletivos através de quadro Kanban.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "BRL"
        }
      }
    </script>

    <!-- Early Theme Initialization (Prevents flash of unstyled theme) -->
    <script>
      (() => {
        const savedTheme = localStorage.getItem("waldo-theme");
        const theme =
          savedTheme === "light" || savedTheme === "dark"
            ? savedTheme
            : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
